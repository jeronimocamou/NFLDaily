name: Add new puzzles

# Once a month: refresh the trivia data (new seasons appear after each Super
# Bowl), append puzzles so there are always a year's worth ready, and commit
# them to main, which redeploys the site. Existing puzzles are never changed.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: puzzles
  cancel-in-progress: false

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Refresh trivia data
        run: python3 scripts/build_db.py --refresh
      - name: Add puzzles through a year from today
        run: python3 scripts/generate_puzzles.py
      - name: Test
        run: npm test
      - name: Commit and push
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data puzzles
          git commit -m "Add puzzles through $(jq -r .last puzzles/index.json)"
          git push
